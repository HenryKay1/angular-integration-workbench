<main class="shell" [class.shell--nav-open]="isNavigationOpen">
  <header class="shell__header">
    <div class="shell__brand">
      <div class="shell__logo" aria-hidden="true">A</div>

      <div>
          <h1>Angular Integration Workbench</h1>
          <p>Enterprise-flavored mock integration explorer</p>
      </div>
    </div>
  </header>

  <aside class="shell__navigation-layer">
    <aiw-navigation
      [sections]="mainNavigationSections"
      [sidebarOpen]="isNavigationOpen"
      [homeRoute]="'/'"
      homeLabel="Dashboard"
      appName="Angular Workbench"
      (collapsed)="closeNavigation()"
      (expanded)="openNavigation()"
    />
  </aside>

  <section class="shell__content">
    <router-outlet />
  </section>
</main>
