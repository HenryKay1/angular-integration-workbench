<h2 mat-dialog-title>{{ title }}</h2>

<mat-dialog-content>
  <p class="confirmation-dialog__message">{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">{{ cancelText }}</button>
  <button mat-flat-button color="primary" type="button" (click)="confirm()">
    {{ confirmText }}
  </button>
</mat-dialog-actions>
