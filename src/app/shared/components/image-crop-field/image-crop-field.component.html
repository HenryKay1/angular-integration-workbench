    <div class="image-crop" [class.image-crop--disabled]="disabled">
      <button
        type="button"
        class="image-crop__surface-button"
        [class.image-crop__surface-button--has-image]="!!value"
        [disabled]="disabled"
        [title]="surfaceActionLabel"
        [attr.aria-label]="surfaceActionLabel"
        (click)="openEditor()"
      >
        <ng-container *ngTemplateOutlet="cropPreview"></ng-container>
        <span class="image-crop__surface-overlay">
          <ng-container *ngTemplateOutlet="value ? editIcon : uploadIcon"></ng-container>
        </span>
      </button>
    </div>

    <div
      *ngIf="isEditorOpen"
      class="image-crop__modal-backdrop"
      (click)="closeEditor()"
    >
      <section class="image-crop__modal" (click)="$event.stopPropagation()">
        <header class="image-crop__modal-header">
          <h3>Edit image</h3>
          <button
            type="button"
            class="image-crop__action image-crop__action--ghost"
            (click)="closeEditor()"
          >
            Close
          </button>
        </header>

        <div class="image-crop__modal-body">
          <div class="image-crop__modal-preview">
            <ng-container *ngTemplateOutlet="cropPreview"></ng-container>
          </div>

          <div class="image-crop__panel">
            <section class="image-crop__section">
              <header class="image-crop__section-header">
                <h4>Image</h4>
              </header>

              <div class="image-crop__image-actions">
                <label class="image-crop__upload-button">
                  <input
                    type="file"
                    class="image-crop__native-input"
                    [attr.accept]="accept || 'image/*'"
                    [disabled]="disabled"
                    (change)="handleFileSelection($event)"
                  />
                  <span>{{ value ? 'Replace image' : 'Choose image' }}</span>
                  <ng-container *ngTemplateOutlet="uploadIcon"></ng-container>
                </label>

                <button
                  *ngIf="value"
                  type="button"
                  class="image-crop__remove"
                  [disabled]="disabled"
                  (click)="removeImage()"
                >
                  <span>Remove</span>
                  <ng-container *ngTemplateOutlet="removeIcon"></ng-container>
                </button>
              </div>
            </section>

            <section class="image-crop__section">
              <header class="image-crop__section-header">
                <h4>Shape</h4>
              </header>

              <div class="image-crop__shape-grid">
                <button
                  *ngFor="let shapeOption of shapeOptions"
                  type="button"
                  class="image-crop__shape-button"
                  [class.image-crop__shape-button--active]="shape === shapeOption.value"
                  [disabled]="disabled"
                  (click)="updateShape(shapeOption.value)"
                >
                  <span
                    class="image-crop__shape-swatch"
                    [class.image-crop__shape-swatch--circle]="shapeOption.value === 'circle'"
                    [class.image-crop__shape-swatch--square]="shapeOption.value === 'square'"
                    [class.image-crop__shape-swatch--rectangle]="shapeOption.value === 'rectangle'"
                    [class.image-crop__shape-swatch--triangle]="shapeOption.value === 'triangle'"
                  ></span>
                  <span>{{ shapeOption.label }}</span>
                </button>
              </div>
            </section>

            <section class="image-crop__section">

              <label class="image-crop__field image-crop__field--slider">
                <span>Size</span>
                <div class="image-crop__slider">
                  <input
                    type="range"
                    [attr.min]="resolvedMinFrameSizePx"
                    [attr.max]="resolvedMaxFrameSizePx"
                    step="4"
                    [disabled]="disabled"
                    [ngModel]="frameSizePx"
                    (ngModelChange)="updateFrameSize($event)"
                  />
                  <strong>{{ frameSizePx }}px</strong>
                </div>
              </label>
            </section>

            <section class="image-crop__section">
              <header class="image-crop__section-header">
                <h4>Crop</h4>
                <button
                  type="button"
                  class="image-crop__reset"
                  [disabled]="disabled"
                  (click)="resetCrop()"
                >
                  <span>Reset</span>
                  <ng-container *ngTemplateOutlet="resetIcon"></ng-container>
                </button>
              </header>

              <label class="image-crop__field image-crop__field--slider">
                <span>Zoom</span>
                <div class="image-crop__slider">
                  <input
                    type="range"
                    min="0.5"
                    max="3"
                    step="0.05"
                    [disabled]="disabled"
                    [ngModel]="crop.zoom"
                    (ngModelChange)="updateCrop('zoom', $event)"
                  />
                  <strong>{{ crop.zoom.toFixed(2) }}x</strong>
                </div>
              </label>

              <label class="image-crop__field image-crop__field--slider">
                <span>Horizontal</span>
                <div class="image-crop__slider">
                  <input
                    type="range"
                    min="-50"
                    max="50"
                    step="1"
                    [disabled]="disabled"
                    [ngModel]="crop.offsetX"
                    (ngModelChange)="updateCrop('offsetX', $event)"
                  />
                  <strong>{{ crop.offsetX }}%</strong>
                </div>
              </label>

              <label class="image-crop__field image-crop__field--slider">
                <span>Vertical</span>
                <div class="image-crop__slider">
                  <input
                    type="range"
                    min="-50"
                    max="50"
                    step="1"
                    [disabled]="disabled"
                    [ngModel]="crop.offsetY"
                    (ngModelChange)="updateCrop('offsetY', $event)"
                  />
                  <strong>{{ crop.offsetY }}%</strong>
                </div>
              </label>
            </section>
          </div>
        </div>
      </section>
    </div>

    <ng-template #cropPreview>
      <div
        class="image-crop__frame"
        [class.image-crop__frame--framed]="showFrame"
        [class.image-crop__frame--circle]="shape === 'circle'"
        [class.image-crop__frame--square]="shape === 'square'"
        [class.image-crop__frame--rectangle]="shape === 'rectangle'"
        [class.image-crop__frame--triangle]="shape === 'triangle'"
        [style.--image-crop-frame-size]="frameSizePx + 'px'"
      >
        <div
          class="image-crop__mask"
          [class.image-crop__mask--empty]="!value?.previewUrl"
          [class.image-crop__mask--circle]="shape === 'circle'"
          [class.image-crop__mask--square]="shape === 'square'"
          [class.image-crop__mask--rectangle]="shape === 'rectangle'"
          [class.image-crop__mask--triangle]="shape === 'triangle'"
          [style.aspect-ratio]="shape === 'rectangle' ? rectangleAspectRatio : '1 / 1'"
        >
          <ng-container *ngIf="value?.previewUrl; else placeholderImage">
            <img
              class="image-crop__image"
              [src]="value?.previewUrl"
              [alt]="value?.originalName || 'Selected image'"
              [style.transform]="imageTransform"
            />
          </ng-container>

          <ng-template #placeholderImage>
            <span class="image-crop__placeholder" aria-hidden="true">
              <ng-container *ngTemplateOutlet="placeholderIcon"></ng-container>
            </span>
          </ng-template>
        </div>
      </div>
    </ng-template>

    <ng-template #placeholderIcon>
      <svg viewBox="0 0 64 48" aria-hidden="true">
        <g class="image-crop__placeholder-card image-crop__placeholder-card--back">
          <rect x="6" y="11" width="31" height="27" rx="5" />
          <circle cx="15" cy="20" r="3.5" />
          <path d="M9 32l8-7 6 5 7-8 7 10" />
        </g>
        <g class="image-crop__placeholder-card image-crop__placeholder-card--mid">
          <rect x="27" y="9" width="31" height="27" rx="5" />
          <circle cx="49" cy="18" r="3.5" />
          <path d="M30 30l7-6 5 4 8-9 8 11" />
        </g>
        <g class="image-crop__placeholder-card image-crop__placeholder-card--front">
          <rect x="16" y="17" width="32" height="27" rx="5" />
          <circle cx="25" cy="26" r="3.5" />
          <path d="M19 38l8-8 6 5 8-9 7 12" />
        </g>
      </svg>
    </ng-template>

    <ng-template #uploadIcon>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 16V8" />
        <path d="M8.5 11.5 12 8l3.5 3.5" />
        <path d="M5 15.5v2A1.5 1.5 0 0 0 6.5 19h11a1.5 1.5 0 0 0 1.5-1.5v-2" />
      </svg>
    </ng-template>

    <ng-template #editIcon>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m4 20 4.5-1 9.25-9.25a1.75 1.75 0 0 0 0-2.5l-1-1a1.75 1.75 0 0 0-2.5 0L5 15.5 4 20Z" />
        <path d="M13.5 7.5 16.5 10.5" />
      </svg>
    </ng-template>

    <ng-template #resetIcon>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 3v6h6" />
        <path d="M3 12a9 9 0 1 0 3-6.7L3 9" />
      </svg>
    </ng-template>

    <ng-template #removeIcon>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 6h18" />
        <path d="M8 6V4h8v2" />
        <path d="M10 11v6" />
        <path d="M14 11v6" />
        <path d="M6 6l1 14h10l1-14" />
      </svg>
    </ng-template>
